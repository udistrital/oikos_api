# === Identificación del proyecto ===
sonar.projectKey=oikos_api
sonar.projectName=oikos_api
sonar.projectVersion=1.0

# === Directorios del código fuente ===
sonar.sources=./
# === Exclusiones (archivos o carpetas que no se analizan) ===
sonar.exclusions=swagger/**,routers/**,database/**

# === Configuración de pruebas ===
sonar.test.inclusions=**/**_test.go
sonar.test.exclusions=database/**

# === Lenguaje y codificación ===
sonar.sourceEncoding=UTF-8